services:
  # PostgreSQL
  postgres:
    image: postgres:18
    container_name: connectgram-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: connectgram
    ports:
      - "5433:5432"
    volumes:
      - connectgram-postgres-data:/var/lib/postgresql

  # Backend
  backend:
    image: goutamchoudhary/connectgram-backend:v1
    container_name: connectgram-backend
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      - postgres

  # Frontend
  frontend:
    image: goutamchoudhary/connectgram-frontend:v1
    container_name: connectgram-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  connectgram-postgres-data:

